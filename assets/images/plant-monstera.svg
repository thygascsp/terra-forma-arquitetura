<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="monsteraGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#4e966c"/>
      <stop offset="35%" stop-color="#2c704c"/>
      <stop offset="75%" stop-color="#154930"/>
      <stop offset="100%" stop-color="#0c2d1e"/>
    </linearGradient>
    <linearGradient id="veinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84c9a4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2c704c" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="monsteraShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="15" dy="25" stdDeviation="16" flood-color="#04120b" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#monsteraShadow)">
    <path d="M250,580 Q250,450 250,160" fill="none" stroke="#25553a" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Contorno característico da folha -->
    <path d="M250,70 
             C330,70 440,120 460,220 
             C470,270 445,300 405,290 
             C445,335 455,380 425,430 
             C395,480 340,510 250,540 
             C160,510 105,480 75,430 
             C45,380 55,335 95,290 
             C55,300 30,270 40,220 
             C60,120 170,70 250,70 Z" 
          fill="url(#monsteraGrad)"/>
    
    <!-- Recortes da fenestração -->
    <ellipse cx="340" cy="210" rx="36" ry="12" transform="rotate(32 340 210)" fill="#112a22" opacity="0.9"/>
    <ellipse cx="360" cy="300" rx="46" ry="14" transform="rotate(22 360 300)" fill="#112a22" opacity="0.9"/>
    <ellipse cx="330" cy="390" rx="40" ry="13" transform="rotate(10 330 390)" fill="#112a22" opacity="0.9"/>
    
    <ellipse cx="160" cy="210" rx="36" ry="12" transform="rotate(-32 160 210)" fill="#112a22" opacity="0.9"/>
    <ellipse cx="140" cy="300" rx="46" ry="14" transform="rotate(-22 140 300)" fill="#112a22" opacity="0.9"/>
    <ellipse cx="170" cy="390" rx="40" ry="13" transform="rotate(-10 170 390)" fill="#112a22" opacity="0.9"/>
    
    <!-- Nervuras -->
    <path d="M250,90 L250,520" stroke="url(#veinGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M250,170 Q320,150 390,170" stroke="url(#veinGrad)" stroke-width="3" fill="none"/>
    <path d="M250,170 Q180,150 110,170" stroke="url(#veinGrad)" stroke-width="3" fill="none"/>
    <path d="M250,250 Q340,230 410,260" stroke="url(#veinGrad)" stroke-width="3" fill="none"/>
    <path d="M250,250 Q160,230 90,260" stroke="url(#veinGrad)" stroke-width="3" fill="none"/>
    <path d="M250,340 Q330,330 390,370" stroke="url(#veinGrad)" stroke-width="2.5" fill="none"/>
    <path d="M250,340 Q170,330 110,370" stroke="url(#veinGrad)" stroke-width="2.5" fill="none"/>
  </g>
</svg>